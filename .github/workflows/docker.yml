name: CI to Docker Hub

on:
  push:
     branches:
       - main
  workflow_dispatch:
  
jobs:
  build:
      runs-on: ubuntu-latest 
      steps:
        - uses: actions/checkout@v3
        - name: Publish to Registry
          uses: elgohr/Publish-Docker-Github-Action@v5
          with:
            name: owner/image
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
            registry: ghcr.io
    


